services:
  api:
    build: .
    container_name: data-breach-monitor-api
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    volumes:
      - .:/app

  worker:
    build: .
    container_name: data-breach-monitor-worker
    env_file:
      - .env
    command: celery -A app.tasks:celery_app worker --loglevel=info
    depends_on:
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    volumes:
      - .:/app

  beat:
    build: .
    container_name: data-breach-monitor-beat
    env_file:
      - .env
    command: celery -A app.tasks:celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    volumes:
      - .:/app

  redis:
    image: redis:7-alpine
    container_name: data-breach-monitor-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: data-breach-monitor-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: data-breach-monitor-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: data-breach-monitor-frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  elasticsearch_data:
  redis_data:
  frontend_node_modules:
