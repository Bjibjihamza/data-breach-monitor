# Copy this file to config/google_alerts_feeds.yml and replace rss_url values
# with RSS links generated from https://www.google.com/alerts.
#
# Keep the real google_alerts_feeds.yml file private. Google Alerts RSS URLs
# can expose personal alert feed identifiers.

google_alerts_feeds:
  - alert_name: "Global cyber incidents monitoring"
    category: "global_cyber_incidents"
    country: "global"
    priority: "critical"
    frequency: "as_it_happens"
    organizations: []
    query: >-
      ("data breach" OR "data leak" OR "database leak" OR "credentials leaked"
      OR "ransomware attack" OR "cyberattack" OR "personal data exposed")
    rss_url: "https://www.google.com/alerts/feeds/YOUR_ALERT_FEED_ID/YOUR_ALERT_TOKEN"

  - alert_name: "Critical CVE and exploit monitoring"
    category: "zero_day_vulnerabilities"
    country: "global"
    priority: "high"
    frequency: "as_it_happens"
    organizations: []
    query: >-
      ("zero-day" OR "0-day" OR "actively exploited" OR "critical vulnerability"
      OR "proof of concept exploit" OR "PoC exploit" OR "CVE")
    rss_url: "https://www.google.com/alerts/feeds/YOUR_ALERT_FEED_ID/YOUR_ALERT_TOKEN"
